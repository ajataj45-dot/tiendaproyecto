

{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Nuevo Pedido</h2>
    </div>
    <div class="card-body">
        <form action="" method="POST">
            <div class="mb-3">
                <label for="fecha_pedido" class="form-label">Fecha Pedido</label>
                <input type="date" class="form-control" name="fecha_pedido" id="fecha_pedido" required>
            </div>
            
            <div class="mb-3">
                <label for="cliente_id" class="form-label">Cliente</label>
                <select name="cliente_id" id="cliente_id" class="form-select" required>
                    <option value="">-- Seleccione un cliente --</option>
                    {% for item in clientes %}
                    <option value="{{ item.id }}">{{ item.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-3">
                <label for="producto_id" class="form-label">Producto</label>
                <select name="producto_id" id="producto_id" class="form-select" required>
                    <option value="">-- Seleccione un producto --</option>
                    {% for item in productos %}
                    <option value="{{ item.id }}">{{ item.nombre_producto }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" min="1" class="form-control" name="cantidad" id="cantidad" required>
            </div>
            
            <button class="btn btn-primary" type="submit">Guardar</button>
        </form>
    </div>
</div>
{% endblock %}
