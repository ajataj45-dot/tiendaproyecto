{% extends "base.html" %}

{% block content %}


<div class="card">
    <div class="card-header">
        <h2>
            {% if producto %}
            Editar
            {% else %}
            Nuevo
            {% endif %}
            producto
        </h2>
    </div>
    <div class="card-body">
        <form action="" method="POST">
            <div class="mb-3">
                <label for="" class="form-label">Nombre Producto</label>
                <input type="text" class="form-control" name="nombre_producto" value="{{ producto.nombre_producto if producto else '' }}" required>

            </div>
            <div class="mb-3">
                <label for="" class="form-label">Precio</label>
                <input type="number" step="0.01" class="form-control" name="precio" value="{{ producto.precio if producto else '' }}" required>
                
            </div>
            <div class="mb-3">
                <label for="" class="form-label">Stock</label>
                <input type="number" class="form-control" name="stock" value="{{ producto.stock if producto else '' }}" required>
                
            </div>
            <button class="btn btn-primary" type="submit">Enviar</button>
        </form>
    </div>
</div>



{% endblock  %}
