
{% extends "base.html" %}

{% block content %}

<h1>Productos</h1>

<a href="{{ url_for('nuevo_producto') }}" class="btn btn-success mb-2">Nuevo</a>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Nombre del Producto</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for item in productos %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.nombre_producto }}</td>
            <td>${{ item.precio }}</td>
            <td>{{ item.stock }}</td>
            <td>
                <a href="{{ url_for('editar_producto', id=item.id) }}" class="btn btn-warning">Editar</a>
                <a href="{{ url_for('eliminar_producto', id=item.id) }}" class="btn btn-danger" onclick="return confirm('¿Estás seguro de eliminar este producto?')">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
