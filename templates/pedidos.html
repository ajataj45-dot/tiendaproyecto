
{% extends "base.html" %}

{% block content %}

<h1>Pedidos</h1>
<a href="{{ url_for('nuevo_pedido') }}" class="btn btn-success mb-2">Nuevo</a>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Fecha Pedido</th>
            <th>Cantidad</th>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for item in pedidos %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.fecha_pedido }}</td>
            <td>{{ item.cantidad }}</td>
            <td>{{ item.cliente }}</td>
            <td>{{ item.producto }}</td>
            <td>
                <a href="{{ url_for('eliminar_pedido', id=item.id) }}" class="btn btn-danger" onclick="return confirm('¿Estás seguro de eliminar este pedido?')">Eliminar</a>
            </td>              
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
